name: nmw
options:
  bundleIdPrefix: pl.emdzej
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
packages:
  NmwUI:
    path: Packages/NmwUI
targets:
  nmw:
    type: application
    supportedDestinations: [macOS, iOS]
    sources: [App]
    dependencies:
      - package: NmwUI
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Notes my Way
        CFBundleName: Notes my Way
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        # Standalone .md files open from Finder / Files (spec §3.5).
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes: [net.daringfireball.markdown]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd]
              public.mime-type: [text/markdown]
    entitlements:
      path: App/nmw.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_NAME: Notes my Way
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_MODULE_NAME: nmw
        PRODUCT_BUNDLE_IDENTIFIER: pl.emdzej.notesmyway
        # A multiplatform target gets the iOS runpath; macOS bundles keep frameworks in Contents/Frameworks.
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"
        "LD_RUNPATH_SEARCH_PATHS[sdk=iphone*]": "$(inherited) @executable_path/Frameworks"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
