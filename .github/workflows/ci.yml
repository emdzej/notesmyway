name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & test (macOS, iOS)
    runs-on: macos-26
    steps:
      - name: Check out
        uses: actions/checkout@v5

      # NmwUI uses the editor engine from a sibling folder
      # (`../swift-markdown-engine` next to this repo), as in local checkouts.
      - name: Check out the editor engine
        run: git clone --depth 1 https://github.com/emdzej/swift-markdown-engine.git "$GITHUB_WORKSPACE/../swift-markdown-engine"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: apple
        run: xcodegen generate

      - name: NmwShared tests
        working-directory: apple/Packages/NmwShared
        run: swift test

      - name: NmwCore tests
        working-directory: apple/Packages/NmwCore
        run: swift test

      # `swift test` can't link the engine's dynamic product here; xcodebuild can.
      - name: NmwUI tests
        working-directory: apple/Packages/NmwUI
        run: xcodebuild test -scheme NmwUI -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/nmwui"

      - name: Build the macOS app
        working-directory: apple
        run: >
          xcodebuild build -project nmw.xcodeproj -scheme nmw -configuration Release
          -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/mac"
          CODE_SIGNING_ALLOWED=NO

      - name: Build the iOS app
        working-directory: apple
        run: >
          xcodebuild build -project nmw.xcodeproj -scheme nmw -configuration Release
          -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/ios"
          CODE_SIGNING_ALLOWED=NO
